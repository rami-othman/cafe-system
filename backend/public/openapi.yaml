openapi: 3.0.3
info:
  title: Cafe System 618 API
  version: 0.1.0
  description: Initial API contract derived from the POS and item customization screens.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Branches
  - name: Shifts
  - name: Menu
  - name: Tables
  - name: Customers
  - name: POS State
  - name: Discounts
  - name: Orders
  - name: Payments
  - name: Receipts
  - name: Refunds
paths:
  /branches:
    get:
      tags: [Branches]
      summary: List cafe branches shown as POS tabs
      responses:
        '200':
          description: Branch list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'

  /shifts/current:
    get:
      tags: [Shifts]
      summary: Get current cashier shift state
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Current shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
    post:
      tags: [Shifts]
      summary: Open a cashier shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShiftRequest'
      responses:
        '201':
          description: Shift opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'

  /shifts/{shiftId}/close:
    post:
      tags: [Shifts]
      summary: Close a cashier shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseShiftRequest'
      responses:
        '200':
          description: Shift closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'

  /menu/categories:
    get:
      tags: [Menu]
      deprecated: true
      summary: Legacy compatibility list of Catalog categories (not for production POS)
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Menu categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuCategory'

  /menu/products:
    get:
      tags: [Menu]
      deprecated: true
      summary: Legacy compatibility Catalog product list (not for production POS)
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          description: Product search text from the POS search box
          schema:
            type: string
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, available, unavailable]
            default: available
      responses:
        '200':
          description: Product cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSummary'

  /menu/products/{productId}:
    get:
      tags: [Menu]
      deprecated: true
      summary: Legacy compatibility Catalog product detail (not for production POS)
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Product customization data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [Customers]
      summary: Search customers for the POS customer selector
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Customer options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'

  /tables:
    get:
      tags: [Tables]
      summary: List cafe tables for dine-in orders
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: status
          in: query
          schema:
            type: string
            enum: [available, occupied, reserved, inactive]
      responses:
        '200':
          description: Cafe tables
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CafeTable'

  /pos/state:
    get:
      tags: [POS State]
      summary: Get POS terminal, shift, cart, and alert state
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: POS state for operational screens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'

  /discounts/available:
    get:
      tags: [Discounts]
      summary: List active discounts and coupon eligibility
      parameters:
        - name: orderId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Available discounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'

  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, held, submitted, paid, cancelled]
        - name: orderType
          in: query
          schema:
            $ref: '#/components/schemas/OrderType'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      summary: Create a POS order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          $ref: '#/components/responses/ValidationError'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order details
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    patch:
      tags: [Orders]
      summary: Update order header, customer, table, discount, or note
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    delete:
      tags: [Orders]
      summary: Cancel an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '204':
          description: Order cancelled

  /orders/{orderId}/items:
    post:
      tags: [Orders]
      summary: Add a customized item to an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderItemRequest'
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/items/{itemId}:
    patch:
      tags: [Orders]
      summary: Update item quantity or selected modifiers
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderItemRequest'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    delete:
      tags: [Orders]
      summary: Remove item from an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/hold:
    post:
      tags: [Orders]
      summary: Put order on hold
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/discount:
    put:
      tags: [Orders]
      summary: Add or replace order discount
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Discount'
      responses:
        '200':
          description: Discount applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    delete:
      tags: [Orders]
      summary: Remove order discount
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Discount removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/discounts/apply:
    post:
      tags: [Discounts]
      summary: Apply a coupon code or available discount to an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  example: OPEN10
                discountId:
                  type: integer
                reason:
                  type: string
      responses:
        '200':
          description: Discount applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /orders/{orderId}/discounts:
    delete:
      tags: [Discounts]
      summary: Remove the current discount from an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Discount removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'

  /orders/{orderId}/payment-summary:
    get:
      tags: [Payments]
      summary: Get payment modal totals, quick amounts, and change due
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: amountReceived
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Payment summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'

  /orders/{orderId}/receipt:
    get:
      tags: [Receipts]
      summary: Get receipt preview data
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Receipt preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'

  /orders/{orderId}/print:
    post:
      tags: [Receipts]
      summary: Print receipt or kitchen ticket
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintOrderRequest'
      responses:
        '202':
          description: Print job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'

  /orders/{orderId}/pay:
    post:
      tags: [Payments]
      summary: Pay an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayOrderRequest'
      responses:
        '200':
          description: Payment completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '422':
          $ref: '#/components/responses/ValidationError'

  /orders/{orderId}/refunds:
    post:
      tags: [Refunds]
      summary: Create a full or partial refund for a paid order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, reason]
              properties:
                type:
                  type: string
                  enum: [full, partial]
                amount:
                  type: number
                  description: Required for partial refunds.
                reason:
                  type: string
                  example: Customer Request
                managerNotes:
                  type: string
      responses:
        '201':
          description: Refund completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  parameters:
    BranchId:
      name: branchId
      in: query
      required: true
      schema:
        type: integer
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
  responses:
    NotFound:
      description: Resource not found
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GenericEnvelope:
      type: object
      required: [data]
      properties:
        data:
          description: Endpoint-specific response payload.
    Branch:
      type: object
      required: [id, name, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
          example: Downtown
        isActive:
          type: boolean
    CafeTable:
      type: object
      required: [id, branchId, name, seats, status]
      properties:
        id:
          type: integer
        branchId:
          type: integer
        name:
          type: string
          example: Table 12
        code:
          type: string
          nullable: true
          example: T12
        seats:
          type: integer
        status:
          type: string
          enum: [available, occupied, reserved, inactive]
        sortOrder:
          type: integer
    Shift:
      type: object
      required: [id, branchId, status, openedAt]
      properties:
        id:
          type: integer
        branchId:
          type: integer
        status:
          type: string
          enum: [open, closed]
        openingCash:
          type: number
          format: double
        closingCash:
          type: number
          format: double
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
    OpenShiftRequest:
      type: object
      required: [branchId, openingCash]
      properties:
        branchId:
          type: integer
        openingCash:
          type: number
          minimum: 0
    CloseShiftRequest:
      type: object
      required: [closingCash]
      properties:
        closingCash:
          type: number
          minimum: 0
        note:
          type: string
    MenuCategory:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:
          type: integer
        name:
          type: string
          example: Coffee
        sortOrder:
          type: integer
    ProductSummary:
      type: object
      required: [id, categoryId, name, basePrice, isAvailable]
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
          example: Cappuccino
        description:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        sizeLabel:
          type: string
          example: 8 oz
        basePrice:
          type: number
          format: double
          example: 4.5
        isAvailable:
          type: boolean
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [modifierGroups]
          properties:
            modifierGroups:
              type: array
              items:
                $ref: '#/components/schemas/ModifierGroup'
    ModifierGroup:
      type: object
      required: [id, name, type, required, minSelections, maxSelections, options]
      properties:
        id:
          type: integer
        name:
          type: string
          example: Size
        type:
          type: string
          enum: [single, multiple]
        required:
          type: boolean
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/ModifierOption'
    ModifierOption:
      type: object
      required: [id, name, priceDelta, isDefault, isAvailable]
      properties:
        id:
          type: integer
        name:
          type: string
          example: Oat Milk
        priceDelta:
          type: number
          format: double
          example: 0.75
        isDefault:
          type: boolean
        isAvailable:
          type: boolean
    Customer:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          example: Walk-in Customer
        phone:
          type: string
          nullable: true
    OrderType:
      type: string
      enum: [dine_in, takeaway, delivery]
    OrderStatus:
      type: string
      enum: [draft, held, submitted, paid, cancelled]
    CreateOrderRequest:
      type: object
      required: [branchId, orderType, items]
      properties:
        branchId:
          type: integer
        shiftId:
          type: integer
        orderType:
          $ref: '#/components/schemas/OrderType'
        tableNumber:
          type: string
          nullable: true
          example: '12'
        customerId:
          type: integer
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AddOrderItemRequest'
        discount:
          $ref: '#/components/schemas/Discount'
        note:
          type: string
    UpdateOrderRequest:
      type: object
      properties:
        orderType:
          $ref: '#/components/schemas/OrderType'
        tableNumber:
          type: string
          nullable: true
        customerId:
          type: integer
          nullable: true
        note:
          type: string
    AddOrderItemRequest:
      type: object
      required: [productId, quantity, modifiers]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          example: 1
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/SelectedModifier'
        note:
          type: string
          example: Warmed
    UpdateOrderItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/SelectedModifier'
        note:
          type: string
    SelectedModifier:
      type: object
      required: [groupId, optionId]
      properties:
        groupId:
          type: integer
        optionId:
          type: integer
    Discount:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
          minimum: 0
        reason:
          type: string
    Order:
      type: object
      required: [id, branchId, orderType, status, items, totals, createdAt]
      properties:
        id:
          type: integer
        branchId:
          type: integer
        shiftId:
          type: integer
        orderType:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        tableNumber:
          type: string
          nullable: true
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        discount:
          $ref: '#/components/schemas/Discount'
        totals:
          $ref: '#/components/schemas/OrderTotals'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      required: [id, productId, name, quantity, unitPrice, lineTotal, modifiers]
      properties:
        id:
          type: integer
        productId:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        lineTotal:
          type: number
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemModifier'
        note:
          type: string
    OrderItemModifier:
      type: object
      required: [groupName, optionName, priceDelta]
      properties:
        groupName:
          type: string
          example: Milk Base
        optionName:
          type: string
          example: Oat Milk
        priceDelta:
          type: number
    OrderTotals:
      type: object
      required: [subtotal, discountTotal, taxTotal, total]
      properties:
        subtotal:
          type: number
          example: 14.5
        discountTotal:
          type: number
          example: 0
        taxRate:
          type: number
          example: 0.08
        taxTotal:
          type: number
          example: 1.16
        total:
          type: number
          example: 15.66
    PrintOrderRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [receipt, kitchen_ticket]
        printerId:
          type: string
          nullable: true
    PrintJob:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [queued, printing, completed, failed]
    PayOrderRequest:
      type: object
      required: [method, amount]
      properties:
        method:
          type: string
          enum: [cash, card, wallet, split]
        amount:
          type: number
          minimum: 0
        tip:
          type: number
          minimum: 0
          default: 0
        reference:
          type: string
          nullable: true
    PaymentResult:
      type: object
      required: [order, payment]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        payment:
          type: object
          required: [id, status, paidAt]
          properties:
            id:
              type: integer
            status:
              type: string
              enum: [paid, failed]
            paidAt:
              type: string
              format: date-time
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
