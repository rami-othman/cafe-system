# Finjan production Nginx vhost — Laravel API
# Installed to /etc/nginx/sites-available/api.cafesystemsyria.com by install.sh
#
# This file intentionally contains ONLY the HTTP (port 80) server block.
# `certbot --nginx` (run by install.sh step 26, once DNS resolves) edits this
# file in place to add the HTTPS server block, the ssl_certificate
# directives, and the http->https redirect. That is the standard, tested
# Certbot workflow — hand-maintaining a second 443 block here would just be a
# second, unverified copy of what Certbot already does correctly.
#
# @@PHP_FPM_SOCKET@@ is replaced by install.sh with the actual detected
# PHP-FPM pool socket path — never hardcode a PHP version here.

server {
    listen 80;
    listen [::]:80;
    server_name api.cafesystemsyria.com;

    root /var/www/cafe-system/backend/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/cafe-api.access.log;
    error_log  /var/log/nginx/cafe-api.error.log;

    # Deny hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:@@PHP_FPM_SOCKET@@;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 512;
}
