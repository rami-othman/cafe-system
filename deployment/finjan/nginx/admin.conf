# Finjan production Nginx vhost — Next.js Super Admin (reverse proxy only)
# Installed to /etc/nginx/sites-available/admin.cafesystemsyria.com by install.sh
#
# HTTP-only on purpose — see the comment at the top of api.conf: `certbot
# --nginx` adds the HTTPS server block for this file too, once DNS resolves.
#
# Next.js listens on 127.0.0.1:3000 ONLY (see systemd/cafe-admin.service) and
# is never exposed on the public interface directly.

server {
    listen 80;
    listen [::]:80;
    server_name admin.cafesystemsyria.com;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/cafe-admin.access.log;
    error_log  /var/log/nginx/cafe-admin.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    gzip on;
    gzip_types application/javascript text/css application/json;
    gzip_min_length 512;
}
