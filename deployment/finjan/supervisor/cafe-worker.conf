; Finjan — Laravel queue worker (Supervisor)
; Installed to /etc/supervisor/conf.d/cafe-worker.conf by install.sh.
;
; *** CURRENTLY NOT AUTOSTARTED. *** See deployment/finjan/FINDINGS.md:
; this codebase has zero ShouldQueue job classes and no jobs/failed_jobs
; migration, so QUEUE_CONNECTION=sync is correct and there is nothing for a
; worker to consume today. install.sh installs this file with
; autostart=false / autorestart=false so it exists and validates cleanly,
; but does not run it.
;
; To activate once real queued jobs exist:
;   1. Add a jobs/failed_jobs migration (php artisan queue:table && php
;      artisan queue:failed-table && php artisan migrate --force), OR switch
;      to redis and install/configure Redis locally on this VPS.
;   2. Set QUEUE_CONNECTION=database (or redis) in backend/.env.
;   3. Edit this file: autostart=true, autorestart=true.
;   4. supervisorctl reread && supervisorctl update && supervisorctl start cafe-worker:*

[program:cafe-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/cafe-system/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/var/www/cafe-system/backend
autostart=false
autorestart=false
user=cafe618
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/cafe618/queue-worker.log
stopwaitsecs=65
