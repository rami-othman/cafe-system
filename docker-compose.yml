services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cafe_system_618
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_system_618"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  super-admin-web:
    build:
      context: ./super_admin_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/super-admin/v1
    volumes:
      - ./super_admin_web:/app
      - super_admin_node_modules:/app/node_modules
    ports:
      - "${SUPER_ADMIN_WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_vendor:
  pgadmin_data:
  super_admin_node_modules:
